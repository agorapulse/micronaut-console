name: Gradle RC Watchdog

on:
  schedule:
    - cron:  '0 0 13 * *'

jobs:
  check:
    name: Verify the Latest Gradle Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: rc
      - run: ./gradlew check
